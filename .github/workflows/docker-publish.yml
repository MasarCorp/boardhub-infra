# ─────────────────────────────────────────────────────────────────
# Reusable workflow: build a Docker image and (optionally) publish
# it to GitHub Container Registry (ghcr.io).
#
# Caller repos invoke this via:
#
#   jobs:
#     publish:
#       uses: MasarCorp/boardhub-infra/.github/workflows/docker-publish.yml@main
#       with:
#         image-name: boardhub-api
#       secrets: inherit
#
# Tag strategy (handled by docker/metadata-action):
#   • pull_request          → build only, no push, tag `pr-<N>` for the artifact
#   • push to default branch → push `latest` and `sha-<short>`
#   • push to other branches → push `<branch>` and `sha-<short>`
#   • git tag `v1.2.3`       → push `1.2.3`, `1.2`, `1`, and `latest`
#
# Required permissions on the caller workflow:
#   permissions:
#     contents: read
#     packages: write
# ─────────────────────────────────────────────────────────────────
name: docker-publish (reusable)

on:
  workflow_call:
    inputs:
      image-name:
        description: "Short image name; published as ghcr.io/<owner>/<image-name>"
        required: true
        type: string
      dockerfile:
        description: "Path to the Dockerfile, relative to repo root"
        required: false
        type: string
        default: "Dockerfile"
      context:
        description: "Build context, relative to repo root"
        required: false
        type: string
        default: "."
      platforms:
        description: "Comma-separated buildx platforms"
        required: false
        type: string
        default: "linux/amd64"
      runs-on:
        description: "Runner label"
        required: false
        type: string
        default: "ubuntu-latest"
    outputs:
      image:
        description: "Full image reference without tag (ghcr.io/<owner>/<name>)"
        value: ${{ jobs.publish.outputs.image }}
      digest:
        description: "Image digest of the built image (sha256:...)"
        value: ${{ jobs.publish.outputs.digest }}
      tags:
        description: "Newline-separated list of tags applied to the image"
        value: ${{ jobs.publish.outputs.tags }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: build & publish
    runs-on: ${{ inputs.runs-on }}
    outputs:
      image: ${{ steps.image-ref.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4

      - name: Checkout boardhub-infra (helper scripts)
        uses: actions/checkout@v4
        with:
          repository: MasarCorp/boardhub-infra
          ref: main
          path: .ci-infra

      - name: Make CI scripts executable
        run: chmod +x .ci-infra/scripts/ci/*.sh

      - name: Compute lowercase image reference
        id: image-ref
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ inputs.image-name }}
        run: .ci-infra/scripts/ci/compute-image-ref.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-ref.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print published image summary
        env:
          EVENT: ${{ github.event_name }}
          IMAGE: ${{ steps.image-ref.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: .ci-infra/scripts/ci/print-published.sh
