# OpenSearch — full-text + vector search (single-node dev config).
#
# Mirrors the compose settings: single-node discovery, security plugin disabled,
# demo config disabled, fixed 512m heap.
#
# Two OpenSearch-specific requirements handled here:
#   1. vm.max_map_count >= 262144 — set by a privileged initContainer via
#      `sysctl -w`. Some managed clouds block privileged pods / host sysctls;
#      the node-level alternative is documented in k8s/README.md.
#   2. bootstrap.memory_lock — compose sets it true with an unlimited memlock
#      ulimit. Kubernetes cannot portably grant an unlimited memlock ulimit to a
#      container, so we set it FALSE here (heap is pinned via -Xms=-Xmx=512m, so
#      memory locking is not required for correctness). See README for enabling it.
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: boardhub
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/part-of: boardhub
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: opensearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: boardhub
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/part-of: boardhub
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch
        app.kubernetes.io/part-of: boardhub
    spec:
      # Raise the host's vm.max_map_count before OpenSearch starts. Requires a
      # privileged container. If your cluster blocks this, delete the initContainer
      # and set the sysctl at the node level instead (see README per-cloud notes).
      initContainers:
        - name: sysctl-max-map-count
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
          securityContext:
            privileged: true
            runAsUser: 0
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.17.1
          ports:
            - name: http
              containerPort: 9200
          env:
            - name: discovery.type
              value: "single-node"
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"          # dev only — no TLS/auth, matches compose
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: bootstrap.memory_lock
              value: "false"         # see header note; true is not portable on k8s
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          volumeMounts:
            - name: opensearchdata
              mountPath: /usr/share/opensearch/data
          # Mirrors the compose healthcheck: GET /_cluster/health
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          # Tunable: 512m heap + JVM/Lucene off-heap overhead. Raise heap AND both
          # memory values together if you index more data (keep heap <= 50% of limit).
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
  volumeClaimTemplates:
    - metadata:
        name: opensearchdata
        labels:
          app.kubernetes.io/name: opensearch
          app.kubernetes.io/part-of: boardhub
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
