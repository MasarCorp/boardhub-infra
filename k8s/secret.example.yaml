# ─────────────────────────────────────────────────────────────────────────────
# TEMPLATE ONLY — DO NOT COMMIT REAL SECRETS.
#
# JWT_SECRET and AI_SERVICE_HMAC_SECRET are blank on purpose: the api refuses to boot
# until each holds a random value of at least 32 bytes. Generate them with
# `openssl rand -base64 48`. The other values are dev placeholders. ROTATE THEM before
# any shared or production use.
#
# Preferred: create the Secret imperatively (values never touch git) instead of
# applying this file:
#
#   kubectl create secret generic boardhub-secrets -n boardhub \
#     --from-literal=POSTGRES_DB=magales \
#     --from-literal=POSTGRES_USER=magales \
#     --from-literal=POSTGRES_PASSWORD='CHANGE-ME' \
#     --from-literal=DB_USER=magales \
#     --from-literal=DB_PASSWORD='CHANGE-ME' \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=MINIO_ROOT_USER=magales \
#     --from-literal=MINIO_ROOT_PASSWORD='CHANGE-ME-secret' \
#     --from-literal=S3_ACCESS_KEY=magales \
#     --from-literal=S3_SECRET_KEY='CHANGE-ME-secret' \
#     --from-literal=AI_SERVICE_HMAC_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=MAGALES_SERVICE_USERNAME='CHANGE-ME-service-account' \
#     --from-literal=MAGALES_SERVICE_PASSWORD='CHANGE-ME' \
#     --from-literal=SAYNEE_WEBHOOK_SECRET='' \
#     --from-literal=BOOTSTRAP_SUPER_ADMIN_EMAIL='' \
#     --from-literal=BOOTSTRAP_SUPER_ADMIN_PASSWORD='' \
#     --from-literal=OPENROUTER_API_KEY='' \
#     --from-literal=ANTHROPIC_API_KEY='' \
#     --from-literal=GROQ_API_KEY=''
#
# NOTE: POSTGRES_USER/PASSWORD and DB_USER/PASSWORD MUST match (they are the same
# credential seen from the server side vs. the api client side), and
# S3_ACCESS_KEY/SECRET_KEY must match MINIO_ROOT_USER/PASSWORD.
# AI_SERVICE_HMAC_SECRET MUST be identical on api and ai-services.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: boardhub-secrets
  namespace: boardhub
  labels:
    app.kubernetes.io/name: boardhub-secrets
    app.kubernetes.io/part-of: boardhub
type: Opaque
stringData:
  # ── postgres (server-side) ──
  POSTGRES_DB: "magales"
  POSTGRES_USER: "magales"
  POSTGRES_PASSWORD: "magales-dev"        # CHANGE ME
  # ── api → postgres (client-side, must match the two above) ──
  DB_USER: "magales"
  DB_PASSWORD: "magales-dev"              # CHANGE ME
  # ── api auth ──
  JWT_SECRET: ""                          # REQUIRED: openssl rand -base64 48
  # ── minio (server-side root creds) ──
  MINIO_ROOT_USER: "magales"
  MINIO_ROOT_PASSWORD: "magales-dev-secret"   # CHANGE ME
  # ── api → minio/S3 (client-side, must match the two above) ──
  S3_ACCESS_KEY: "magales"
  S3_SECRET_KEY: "magales-dev-secret"    # CHANGE ME
  # ── inter-service HMAC (api <-> ai-services, must be identical) ──
  AI_SERVICE_HMAC_SECRET: ""              # REQUIRED: openssl rand -base64 48
  # ── ai-services → api service account ──
  # Blank on purpose: ai-services then runs unauthenticated and logs an error. Fill these with a
  # dedicated user, never a person's username and never `admin`, the operator's default. ai-services
  # logs in to each tenant with this name, and a wrong password counts against whoever has that
  # name in that tenant. Five lock them, the only operator included.
  MAGALES_SERVICE_USERNAME: ""
  MAGALES_SERVICE_PASSWORD: ""
  # ── optional integrations (blank in dev, matches compose ${VAR:-} defaults) ──
  SAYNEE_WEBHOOK_SECRET: ""
  BOOTSTRAP_SUPER_ADMIN_EMAIL: ""
  BOOTSTRAP_SUPER_ADMIN_PASSWORD: ""
  # ── AI provider keys (optional; supply to enable live AI round-trips) ──
  OPENROUTER_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GROQ_API_KEY: ""
