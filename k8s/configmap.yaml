# Non-secret configuration for the BoardHub stack.
# Hostnames are in-cluster Service names, which happen to match the compose service
# names: postgres, minio, opensearch, api, ai-services.
#
# Unlike docker-compose.dev.yml this file carries no dev convenience. These stay unset on
# purpose, so the API's safe defaults apply: APP_SECURITY_ALLOW_DEV_CONFIG (startup guard on),
# APP_SQL_INIT_LOCATIONS (schema repairs only, no demo seed), APP_API_DOCS_ENABLED,
# APP_TENANCY_SIGNUP_ENABLED, APP_TENANCY_SIGNUP_DEV_HINT, APP_AI_ALLOW_TENANT_ENDPOINTS.
#
# boardhub.example.com is a placeholder until the real domain is known. Replace it here and in
# ingress.yaml. See README.md, "Exposing the UI".
#
# Secrets (passwords, JWT, HMAC, provider API keys) live in the Secret, NOT here.
# See secret.example.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: boardhub-config
  namespace: boardhub
  labels:
    app.kubernetes.io/name: boardhub-config
    app.kubernetes.io/part-of: boardhub
data:
  # ── Datastore endpoints (in-cluster DNS Service names) ──
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "magales"          # load-bearing: JDBC db name, matches compose POSTGRES_DB
  S3_ENDPOINT: "http://minio:9000"
  S3_BUCKET: "magales-docs"
  OPENSEARCH_URL: "http://opensearch:9200"

  # ── api (Spring Boot) ──
  SPRING_PROFILES_ACTIVE: "postgres"
  # Dev/portable: no SMTP server runs in-cluster, so don't gate /actuator/health on the mail indicator.
  MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
  AI_SERVICES_BASE_URL: "http://ai-services:8081"
  # Tenancy. A tenant is reached at <slug>.<host suffix>. With no default tenant, the bare host
  # resolves to nothing. A named tunnel can turn the default on later for a real tenant.
  APP_TENANCY_ALLOW_DEFAULT_TENANT: "false"
  APP_TENANCY_HOST_SUFFIXES: "boardhub.example.com"
  APP_TENANCY_VERIFICATION_BASE_URL: "https://boardhub.example.com/verify-email"
  # The default "_platform" slug cannot be a sub-domain, and the production UI sends no tenant
  # header. With this the operator signs in at platform.<host suffix>.
  BOOTSTRAP_PLATFORM_TENANT_SLUG: "platform"

  # ── ai-services (Python / FastAPI) ──
  MAGALES_INTERNAL_BASE_URL: "http://api:8080/api"
  DEFAULT_PROVIDER: "openrouter"
  # Host Ollama is not reachable from a generic cluster; left as the compose default.
  # Point this at an in-cluster Ollama Service if/when you deploy one.
  OLLAMA_BASE_URL: "http://host.docker.internal:11434"
  TRANSCRIBE_PROVIDER: "openrouter"
  TRANSCRIBE_OPENROUTER_MODEL: "elevenlabs/scribe-v2"
  WHISPER_MODEL: "medium"
  HF_HOME: "/models/hf"
  # Blank, not absent: ai-services defaults to the demo tenants otherwise. List real slugs here.
  INSIGHTS_TENANTS_CSV: ""
  INSIGHTS_REFRESH_MINUTES: "30"
