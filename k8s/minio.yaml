# MinIO — S3-compatible object storage.
# 9000 = S3 API, 9001 = web console. Started with `server /data --console-address :9001`
# to match compose. Root creds come from the Secret.
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: boardhub
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: boardhub
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: boardhub
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: boardhub
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: boardhub
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: boardhub-secrets, key: MINIO_ROOT_USER }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: boardhub-secrets, key: MINIO_ROOT_PASSWORD }
          volumeMounts:
            - name: miniodata
              mountPath: /data
          # Mirrors the compose healthcheck: GET /minio/health/live
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          # Tunable: light at dev scale; object storage is mostly I/O bound.
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: miniodata
        labels:
          app.kubernetes.io/name: minio
          app.kubernetes.io/part-of: boardhub
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
